<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dignagar Jatiya Yuva Computer Centre — Management</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#0d1117);--surface:light-dark(#fff,#161b22);--surface2:light-dark(#f0f3f8,#21262d);--text:light-dark(#172033,#f0f6fc);--muted:light-dark(#667085,#9da7b3);--border:light-dark(#e4e7ec,#30363d);--primary:light-dark(#3157d5,#6d83ff);--success:light-dark(#11875d,#3ddc97);--danger:light-dark(#d92d20,#ff6b6b);--warning:light-dark(#b54708,#ffb454)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:16px;margin:0}.brand small{color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.pill{padding:7px 11px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}aside{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--text)}main{padding:26px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.page-title h2{margin:0 0 6px;font-size:24px}.page-title p{margin:0;color:var(--muted)}button.primary,.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--danger)}.btn.success{background:var(--success);color:#061b13}.btn.warn{background:var(--warning);color:#231205}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}.stat-label{color:var(--muted);font-size:13px}.stat{font-size:28px;font-weight:800;margin-top:7px}.stat-note{font-size:12px;color:var(--muted);margin-top:6px}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);white-space:nowrap}.table th{color:var(--muted);font-weight:600}.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.paid{background:light-dark(#e8f8f1,#123629);color:var(--success)}.due{background:light-dark(#fff1ed,#3a1e1c);color:var(--danger)}.partial{background:light-dark(#fff7e8,#392b17);color:var(--warning)}.info{background:light-dark(#eef2ff,#1d2440);color:var(--primary)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;outline:none}.field.full{grid-column:1/-1}.form-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}.notice{padding:12px 14px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--muted)}.kpi{font-size:20px;font-weight:800}.message-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;font-size:13px;line-height:1.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px}.hide{display:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.show{display:flex}.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}.receipt{border:1px dashed var(--border);padding:22px;border-radius:12px;background:var(--surface2)}.receipt h2{text-align:center;margin:0 0 4px}.receipt .center{text-align:center}.receipt-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}.footer-note{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:950px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--border);padding:8px;position:sticky;top:72px;z-index:4}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}@media(max-width:600px){header{padding:0 12px}.brand h1{font-size:13px}.brand small{display:none}main{padding:16px}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.form-actions{grid-column:auto}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><div class="logo">DJ</div><div><h1>Dignagar Jatiya Yuva Computer Centre</h1><small>Institute Management & Examination System</small></div></div><div class="top-actions"><span class="pill">Admin Mode</span><button class="btn secondary" onclick="resetDemo()">Reset Demo</button></div></header>
<div class="layout"><aside><nav class="nav" id="nav"></nav></aside><main id="main"></main></div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
</div>
<script>
const defaultData={
 students:[
  {id:'DJ-2026-001',name:'Riya Das',mobile:'9876543210',course:'DIT',admission:'2026-09-01',total:6000,paid:4000,next:'2026-10-15',password:'Riya@001'},
  {id:'DJ-2026-002',name:'Rakesh Ghosh',mobile:'9876501234',course:'CIT',admission:'2026-09-05',total:5000,paid:5000,next:'',password:'Rakesh@002'},
  {id:'DJ-2026-003',name:'Susmita Roy',mobile:'9830012345',course:'Tally + GST',admission:'2026-09-12',total:8000,paid:3000,next:'2026-10-10',password:'Susmita@003'}
 ],
 payments:[{student:'DJ-2026-001',amount:2000,date:'2026-10-01',mode:'Cash'},{student:'DJ-2026-001',amount:2000,date:'2026-09-01',mode:'UPI'},{student:'DJ-2026-002',amount:5000,date:'2026-09-05',mode:'UPI'},{student:'DJ-2026-003',amount:3000,date:'2026-09-12',mode:'Cash'}],
 exams:[{id:'EX-001',title:'Visual FoxPro & Visual Basic',course:'DIT',date:'2026-10-10',duration:30,questions:20},{id:'EX-002',title:'Internet Theory & Practical',course:'CIT',date:'2026-10-15',duration:40,questions:25}],
 settings:{sms:true,whatsapp:true,autoBlock:true,centre:'Dignagar Jatiya Yuva Computer Centre'}
};
let data=JSON.parse(localStorage.getItem('djcc_data')||'null')||defaultData;let page='dashboard';
const navItems=[['dashboard','▦','Dashboard'],['students','♙','Students'],['admission','＋','New Admission'],['fees','₹','Fees & Installments'],['admit','▣','Admit Cards'],['exams','✓','Exams & Results'],['portal','▶','Student Exam Portal'],['messages','✉','SMS / WhatsApp'],['settings','⚙','Settings']];
function save(){localStorage.setItem('djcc_data',JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function due(s){return Math.max(0,s.total-s.paid)}
function nav(){document.getElementById('nav').innerHTML=navItems.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${ic}&nbsp;&nbsp;${t}</button>`).join('')}
function go(p){page=p;nav();render()}
function render(){let el=document.getElementById('main');el.innerHTML=views[page]();}
function header(title,sub,button=''){return `<div class="page-title"><div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`}
function dashboard(){let total=data.students.length,paid=data.students.filter(s=>due(s)===0).length,dueStudents=data.students.filter(s=>due(s)>0),outstanding=data.students.reduce((a,s)=>a+due(s),0);return header('Dashboard','A single place to manage admissions, fees, admit cards and exams.')+`<div class="grid stats"><div class="card"><div class="stat-label">Total Students</div><div class="stat">${total}</div><div class="stat-note">Active database records</div></div><div class="card"><div class="stat-label">Fees Fully Paid</div><div class="stat">${paid}</div><div class="stat-note">Eligible for exam</div></div><div class="card"><div class="stat-label">Students With Due</div><div class="stat">${dueStudents.length}</div><div class="stat-note">Send reminders</div></div><div class="card"><div class="stat-label">Outstanding</div><div class="stat">₹${outstanding.toLocaleString('en-IN')}</div><div class="stat-note">Total pending amount</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><h3>Fee Due Watchlist</h3><button class="btn secondary" onclick="go('fees')">Manage Fees</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Due</th><th>Exam Access</th></tr></thead><tbody>${dueStudents.map(s=>`<tr><td>${esc(s.name)}<br><small>${s.id}</small></td><td>${esc(s.course)}</td><td><span class="status due">₹${due(s).toLocaleString('en-IN')}</span></td><td><span class="status due">BLOCKED</span></td></tr>`).join('')||'<tr><td colspan="4">No pending fees.</td></tr>'}</tbody></table></div></div><div class="card"><div class="section-head"><h3>System Flow</h3></div><div class="message-box">1. Register student → 2. Print admission receipt → 3. Track installments → 4. Send due reminder → 5. Generate admit card + password → 6. Exam access checks fees → 7. Save result.</div><div style="margin-top:12px" class="notice"><b>Important:</b> In this preview, data is saved in this browser. Live multi-device exams and real automatic SMS/WhatsApp require an online database + messaging gateway.</div></div></div>`}
function students(){return header('Students','Search and manage every registered student.','<button class="primary" onclick="go(\'admission\')">+ New Admission</button>')+`<div class="card"><div class="toolbar"><input class="search" id="studentSearch" placeholder="Search name, registration or mobile..." oninput="filterStudents()"><button class="btn secondary" onclick="printStudentList()">Print List</button></div><div class="table-wrap" style="margin-top:14px"><table class="table" id="studentTable"><thead><tr><th>Registration</th><th>Student</th><th>Mobile</th><th>Course</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.students.map(s=>studentRow(s)).join('')}</tbody></table></div></div>`}
function studentRow(s){return `<tr><td><b>${s.id}</b></td><td>${esc(s.name)}</td><td>${s.mobile}</td><td>${esc(s.course)}</td><td>₹${s.total}</td><td>₹${s.paid}</td><td>₹${due(s)}</td><td><span class="status ${due(s)?'due':'paid'}">${due(s)?'DUE':'CLEAR'}</span></td><td><button class="btn secondary" onclick="showStudent('${s.id}')">View</button></td></tr>`}
function filterStudents(){let q=document.getElementById('studentSearch').value.toLowerCase();document.querySelector('#studentTable tbody').innerHTML=data.students.filter(s=>`${s.id} ${s.name} ${s.mobile} ${s.course}`.toLowerCase().includes(q)).map(studentRow).join('')}
function admission(){return header('New Admission','Create registration, generate password and print the admission receipt.')+`<div class="card"><form class="form" onsubmit="newAdmission(event)"><div class="field"><label>Student Name *</label><input id="a_name" required></div><div class="field"><label>Mobile Number *</label><input id="a_mobile" pattern="[0-9]{10}" maxlength="10" required></div><div class="field"><label>Course *</label><select id="a_course"><option>DIT</option><option>CIT</option><option>Tally + GST</option><option>Advanced Excel + AI</option><option>Power BI</option></select></div><div class="field"><label>Total Course Fee (₹)</label><input id="a_total" type="number" min="0" required></div><div class="field"><label>Initial Payment (₹)</label><input id="a_paid" type="number" min="0" value="0" required></div><div class="field"><label>Next Installment Date</label><input id="a_next" type="date"></div><div class="field full"><label>Address / Notes</label><textarea id="a_note" rows="3"></textarea></div><div class="form-actions"><button type="button" class="btn secondary" onclick="go('students')">Cancel</button><button class="primary">Register Student & Generate Receipt</button></div></form></div>`}
function newAdmission(e){e.preventDefault();let n=document.getElementById('a_name').value.trim(),m=document.getElementById('a_mobile').value,c=document.getElementById('a_course').value,t=+document.getElementById('a_total').value,p=+document.getElementById('a_paid').value;let id='DJ-'+new Date().getFullYear()+'-'+String(data.students.length+1).padStart(3,'0');let pass=n.replace(/\s+/g,'').slice(0,5)+'@'+String(data.students.length+1).padStart(3,'0');let s={id,name:n,mobile:m,course:c,admission:new Date().toISOString().slice(0,10),total:t,paid:p,next:document.getElementById('a_next').value,password:pass};data.students.push(s);if(p)data.payments.push({student:id,amount:p,date:new Date().toISOString().slice(0,10),mode:'Cash'});save();showReceipt(s,'Registration successful.');}
function fees(){let outstanding=data.students.reduce((a,s)=>a+due(s),0);return header('Fees & Installments','Record payments, calculate due automatically and control exam eligibility.')+`<div class="grid three"><div class="card"><div class="stat-label">Outstanding</div><div class="kpi">₹${outstanding.toLocaleString('en-IN')}</div></div><div class="card"><div class="stat-label">Due Students</div><div class="kpi">${data.students.filter(s=>due(s)).length}</div></div><div class="card"><div class="stat-label">Auto Exam Rule</div><div class="kpi">${data.settings.autoBlock?'ON':'OFF'}</div></div></div><div class="card" style="margin-top:16px"><div class="section-head"><h3>Installment Ledger</h3><button class="btn warn" onclick="sendDueAll()">Prepare Due Reminders</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Course Fee</th><th>Paid</th><th>Due</th><th>Next Date</th><th>Action</th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.name)}<br><small>${s.id}</small></td><td>₹${s.total}</td><td>₹${s.paid}</td><td><span class="status ${due(s)?'due':'paid'}">₹${due(s)}</span></td><td>${s.next||'-'}</td><td><button class="btn success" onclick="payment('${s.id}')">Add Payment</button> <button class="btn secondary" onclick="messageStudent('${s.id}')">Message</button></td></tr>`).join('')}</tbody></table></div></div>`}
function payment(id){let s=data.students.find(x=>x.id===id);modal(`<h3>Add Fee Payment</h3><p>${esc(s.name)} — ${s.id}</p><div class="form"><div class="field"><label>Amount (₹)</label><input id="pay_amt" type="number" min="1" max="${due(s)||999999}" required></div><div class="field"><label>Payment Mode</label><select id="pay_mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option></select></div></div><div class="form-actions" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn success" onclick="savePayment('${id}')">Save Payment & Receipt</button></div>`)}
function savePayment(id){let s=data.students.find(x=>x.id===id),amt=+document.getElementById('pay_amt').value;if(!amt||amt>due(s))return alert('Enter a valid amount.');s.paid+=amt;data.payments.push({student:id,amount:amt,date:new Date().toISOString().slice(0,10),mode:document.getElementById('pay_mode').value});save();showReceipt(s,'Fee payment recorded successfully.');}
function admit(){return header('Admit Cards','Generate an admit card with registration number and exam password.','<button class="primary" onclick="printAllAdmit()">Print Eligible Admit Cards</button>')+`<div class="card"><div class="notice">Exam access rule: students with outstanding installment due are automatically marked <b>BLOCKED</b> when Auto Block is ON.</div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Registration</th><th>Student</th><th>Course</th><th>Password</th><th>Fee Status</th><th>Admit</th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.course)}</td><td><code>${esc(s.password)}</code></td><td><span class="status ${due(s)&&data.settings.autoBlock?'due':'paid'}">${due(s)&&data.settings.autoBlock?'BLOCKED':'ELIGIBLE'}</span></td><td><button class="btn secondary" onclick="showAdmit('${s.id}')">View / Print</button></td></tr>`).join('')}</tbody></table></div></div>`}
function exams(){return header('Exams & Results','Create exams, set questions later, and keep results linked to student records.','<button class="primary" onclick="newExam()">+ New Exam</button>')+`<div class="grid two">${data.exams.map(e=>`<div class="card"><div class="section-head"><h3>${esc(e.title)}</h3><span class="status info">${e.id}</span></div><p style="color:var(--muted)">Course: ${esc(e.course)}<br>Date: ${e.date}<br>Duration: ${e.duration} minutes · ${e.questions} questions</p><div class="toolbar"><button class="btn secondary" onclick="examInfo('${e.id}')">Exam Settings</button><button class="btn" onclick="examAccess('${e.id}')">Check Student Access</button></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="section-head"><h3>Exam Control</h3></div><div class="message-box">When a student enters registration number + password, the live system should verify: <b>student exists → correct exam → fee status clear → admit card valid → exam opens.</b> If fee is due, show a clear payment-required message instead of starting the exam.</div></div>`}
function portal(){return header('Student Online Exam Portal','Share the exam portal with students. They enter the Registration Number and Password printed on the admit card.')+`<div class="card" style="max-width:650px;margin:20px auto"><h2 style="margin-top:0">🎓 Online Examination</h2><p style="color:var(--muted)">Students can use this portal from mobile, laptop or desktop. Fee status is checked before the exam opens.</p><div class="toolbar" style="margin-bottom:14px"><button class="btn secondary" onclick="sharePortal()">🔗 Copy Exam Link</button><span class="pill">Student Portal</span></div><div class="form"><div class="field full"><label>Select Examination</label><select id="p_exam">${data.exams.map(e=>`<option value="${e.id}">${esc(e.title)} — ${e.date}</option>`).join('')}</select></div><div class="field"><label>Registration Number</label><input id="p_reg" placeholder="DJ-2026-001"></div><div class="field"><label>Exam Password</label><input id="p_pass" type="password" placeholder="Admit card password"></div><div class="form-actions"><button class="primary" onclick="startExam()">Login & Start Exam</button></div></div><div class="notice" style="margin-top:14px"><b>Fee protection:</b> If the student's installment is due, the system will block the examination automatically when Auto Block is ON.</div></div>`}
function sharePortal(){let link=location.href;if(location.protocol==='file:'){alert('এই ফাইলটি এখন আপনার computer-এ local preview হিসেবে চলছে। Student-দের share করার আগে এটিকে free online hosting-এ publish করতে হবে। তারপর এই button থেকেই live exam link copy করা যাবে.');return}navigator.clipboard?.writeText(link);alert('Exam link copied. এখন students-দের WhatsApp/SMS-এ পাঠাতে পারেন।')}
function startExam(){let id=document.getElementById('p_exam').value,reg=document.getElementById('p_reg').value.trim().toUpperCase(),pass=document.getElementById('p_pass').value,s=data.students.find(x=>x.id.toUpperCase()===reg),e=data.exams.find(x=>x.id===id);if(!s)return alert('Registration number not found.');if(s.password!==pass)return alert('Incorrect exam password.');if(data.settings.autoBlock&&due(s)>0){document.getElementById('main').innerHTML=header('Exam Access Blocked','Payment is required before examination access.')+`<div class="card" style="max-width:600px;margin:30px auto;text-align:center"><div style="font-size:50px">🔒</div><h2>Fee Due: ₹${due(s).toLocaleString('en-IN')}</h2><p>Your examination cannot be started until the pending installment is cleared.</p><button class="primary" onclick="go('portal')">Back to Portal</button></div>`;return}renderExam(e,s)}
function renderExam(e,s){let count=Math.max(1,e.questions||20);let qs=Array.from({length:count},(_,i)=>({q:`${e.title} — Question ${i+1}: Choose the correct answer.`,opts:['Option A','Option B','Option C','Option D']}));document.getElementById('main').innerHTML=`<div class="card"><div class="section-head"><div><h2 style="margin:0">${esc(e.title)}</h2><p style="margin:5px 0;color:var(--muted)">Candidate: ${esc(s.name)} · ${s.id}</p></div><b id="examTimer">${e.duration}:00</b></div><div class="notice">Do not close the browser during the examination. Click Submit Examination when finished.</div><form id="examForm" style="margin-top:16px">${qs.map((q,i)=>`<div class="card" style="margin-bottom:12px"><b>Q${i+1}. ${esc(q.q)}</b>${q.opts.map((o,j)=>`<label style="display:block;padding:10px;margin-top:8px;border:1px solid var(--border);border-radius:8px"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<div class="form-actions"><button type="button" class="btn danger" onclick="submitExam('${e.id}','${s.id}')">Submit Examination</button></div></form></div>`;let sec=(e.duration||30)*60;let timer=setInterval(()=>{if(!document.getElementById('examTimer')){clearInterval(timer);return}sec--;let m=Math.floor(sec/60),x=String(sec%60).padStart(2,'0');document.getElementById('examTimer').textContent=`${m}:${x}`;if(sec<=0){clearInterval(timer);submitExam(e.id,s.id)}},1000)}
function submitExam(eid,sid){let e=data.exams.find(x=>x.id===eid),s=data.students.find(x=>x.id===sid),answered=document.querySelectorAll('#examForm input:checked').length,score=Math.round((answered/(e.questions||20))*100);data.results=data.results||[];data.results.push({exam:eid,student:sid,answered,score,date:new Date().toISOString().slice(0,10)});save();document.getElementById('main').innerHTML=header('Examination Submitted','Your response has been recorded successfully.')+`<div class="card" style="max-width:650px;margin:30px auto;text-align:center"><div style="font-size:50px">✓</div><h2>Thank You, ${esc(s.name)}</h2><p>Your examination has been submitted.</p><div class="grid three"><div class="card"><b>${answered}</b><br><small>Answered</small></div><div class="card"><b>${score}%</b><br><small>Score</small></div><div class="card"><b>Saved</b><br><small>Status</small></div></div><button class="primary" onclick="go('portal')">Exit Portal</button></div>`}
function messages(){let dueList=data.students.filter(s=>due(s));return header('SMS / WhatsApp','Prepare registration, payment and due-reminder messages.')+`<div class="grid two"><div class="card"><div class="section-head"><h3>Due Reminder Queue</h3><span class="status due">${dueList.length} pending</span></div>${dueList.map(s=>`<div class="message-box" style="margin-bottom:10px"><b>${esc(s.name)}</b> · ${s.mobile}<br>Dear ${esc(s.name)}, your installment due is ₹${due(s).toLocaleString('en-IN')}. Please clear your pending fee before the examination.<div class="toolbar" style="margin-top:9px"><button class="btn secondary" onclick="messageStudent('${s.id}')">Open Message</button></div></div>`).join('')||'<div class="notice">No due reminders.</div>'}</div><div class="card"><h3 style="margin-top:0">Message Templates</h3><div class="message-box"><b>Registration:</b> Dear {name}, your registration at Dignagar Jatiya Yuva Computer Centre is successfully completed. Registration No: {reg}. Thank you.</div><br><div class="message-box"><b>Payment:</b> Dear {name}, your fee payment of ₹{amount} has been received successfully. Remaining due: ₹{due}.</div><br><div class="message-box"><b>Exam:</b> Dear {name}, your admit card is ready. Registration No: {reg}. Exam password: {password}. Please keep it confidential.</div></div></div>`}
function settings(){return header('Settings','Institute rules and messaging preferences.')+`<div class="card"><div class="form"><div class="field"><label>Institute Name</label><input id="set_centre" value="${esc(data.settings.centre)}"></div><div class="field"><label>Auto Block Exam When Fee Due</label><select id="set_block"><option value="true" ${data.settings.autoBlock?'selected':''}>ON</option><option value="false" ${!data.settings.autoBlock?'selected':''}>OFF</option></select></div><div class="field"><label>SMS Integration</label><select id="set_sms"><option value="true" ${data.settings.sms?'selected':''}>Enabled</option><option value="false" ${!data.settings.sms?'selected':''}>Disabled</option></select></div><div class="field"><label>WhatsApp Integration</label><select id="set_wa"><option value="true" ${data.settings.whatsapp?'selected':''}>Enabled</option><option value="false" ${!data.settings.whatsapp?'selected':''}>Disabled</option></select></div><div class="form-actions"><button class="primary" onclick="saveSettings()">Save Settings</button></div></div><div class="notice" style="margin-top:16px"><b>Live integration note:</b> Actual automatic SMS and WhatsApp messages need a connected messaging provider/API. This preview prepares the workflow and message templates; it does not send messages by itself.</div></div>`}
const views={dashboard,students,admission,fees,admit,exams,portal,messages,settings};
function modal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
function showStudent(id){let s=data.students.find(x=>x.id===id);modal(`<div class="section-head"><h3>Student Profile</h3><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="receipt"><div class="receipt-row"><b>Registration</b><span>${s.id}</span></div><div class="receipt-row"><b>Name</b><span>${esc(s.name)}</span></div><div class="receipt-row"><b>Mobile</b><span>${s.mobile}</span></div><div class="receipt-row"><b>Course</b><span>${esc(s.course)}</span></div><div class="receipt-row"><b>Fee</b><span>₹${s.total}</span></div><div class="receipt-row"><b>Paid</b><span>₹${s.paid}</span></div><div class="receipt-row"><b>Due</b><span>₹${due(s)}</span></div><div class="receipt-row"><b>Exam Password</b><span>${esc(s.password)}</span></div></div><div class="toolbar" style="margin-top:14px"><button class="btn success" onclick="payment('${s.id}')">Add Payment</button><button class="btn secondary" onclick="showAdmit('${s.id}')">Admit Card</button><button class="btn secondary" onclick="messageStudent('${s.id}')">Message</button></div>`)}
function showReceipt(s,msg){modal(`<div class="receipt" id="printArea"><h2>${esc(data.settings.centre)}</h2><div class="center">Admission / Fee Receipt</div><hr><div class="receipt-row"><b>Registration No.</b><span>${s.id}</span></div><div class="receipt-row"><b>Student Name</b><span>${esc(s.name)}</span></div><div class="receipt-row"><b>Course</b><span>${esc(s.course)}</span></div><div class="receipt-row"><b>Mobile</b><span>${s.mobile}</span></div><div class="receipt-row"><b>Total Fee</b><span>₹${s.total}</span></div><div class="receipt-row"><b>Total Paid</b><span>₹${s.paid}</span></div><div class="receipt-row"><b>Current Due</b><span>₹${due(s)}</span></div><div class="receipt-row"><b>Exam Password</b><span>${esc(s.password)}</span></div><p style="color:var(--success);font-weight:700">✓ ${msg}</p></div><div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn secondary" onclick="printReceipt()">Print Receipt</button><button class="primary" onclick="closeModal();go('dashboard')">Done</button></div>`)}
function printReceipt(){let html=document.getElementById('printArea').outerHTML;let w=window.open('','_blank');w.document.write('<html><head><title>Receipt</title><style>body{font-family:Arial;padding:30px}.receipt{max-width:600px;margin:auto}.receipt-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ddd}</style></head><body>'+html+'</body></html>');w.document.close();w.print()}
function showAdmit(id){let s=data.students.find(x=>x.id===id),blocked=due(s)&&data.settings.autoBlock;modal(`<div class="receipt" id="admitArea"><h2>${esc(data.settings.centre)}</h2><div class="center"><b>ADMIT CARD</b></div><hr><div class="receipt-row"><b>Registration No.</b><span>${s.id}</span></div><div class="receipt-row"><b>Student</b><span>${esc(s.name)}</span></div><div class="receipt-row"><b>Course</b><span>${esc(s.course)}</span></div><div class="receipt-row"><b>Exam Password</b><span>${esc(s.password)}</span></div><div class="receipt-row"><b>Fee Status</b><span>${blocked?'PENDING — EXAM BLOCKED':'CLEAR — ELIGIBLE'}</span></div><p style="color:${blocked?'#d92d20':'#11875d'};font-weight:700">${blocked?'Please clear installment due before exam access.':'Student is eligible for exam access.'}</p></div><div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn secondary" onclick="printAdmit()">Print Admit Card</button><button class="btn secondary" onclick="closeModal()">Close</button></div>`)}
function printAdmit(){let html=document.getElementById('admitArea').outerHTML;let w=window.open('','_blank');w.document.write('<html><head><title>Admit Card</title><style>body{font-family:Arial;padding:30px}.receipt{max-width:650px;margin:auto}.receipt-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #ddd}</style></head><body>'+html+'</body></html>');w.document.close();w.print()}
function messageStudent(id){let s=data.students.find(x=>x.id===id),d=due(s),txt=d?`Dear ${s.name}, your installment due is ₹${d}. Please clear your pending fee before the examination. Registration No: ${s.id}.`:`Dear ${s.name}, your fee payment is clear. Registration No: ${s.id}.`;modal(`<h3>Message for ${esc(s.name)}</h3><div class="field"><label>Message</label><textarea id="msg" rows="6">${esc(txt)}</textarea></div><div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="copyMsg()">Copy Message</button><button class="btn success" onclick="openWA('${s.mobile}')">Open WhatsApp</button><button class="btn secondary" onclick="closeModal()">Close</button></div><p class="footer-note">WhatsApp opens with a prefilled message. Automatic sending requires a WhatsApp Business API/provider.</p>`)}
function copyMsg(){navigator.clipboard?.writeText(document.getElementById('msg').value);alert('Message copied.')}
function openWA(m){let txt=encodeURIComponent(document.getElementById('msg').value);window.open('https://wa.me/91'+m+'?text='+txt,'_blank')}
function sendDueAll(){go('messages')}
function printStudentList(){window.print()}
function printAllAdmit(){alert('For live use, this button will generate eligible students only. Students with fee due remain blocked.')}
function newExam(){modal(`<h3>Create Exam</h3><div class="form"><div class="field"><label>Exam Title</label><input id="e_title"></div><div class="field"><label>Course</label><input id="e_course"></div><div class="field"><label>Date</label><input id="e_date" type="date"></div><div class="field"><label>Duration (minutes)</label><input id="e_dur" type="number" value="30"></div><div class="field"><label>Questions</label><input id="e_q" type="number" value="20"></div></div><div class="form-actions" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveExam()">Create Exam</button></div>`)}
function saveExam(){data.exams.push({id:'EX-'+String(data.exams.length+1).padStart(3,'0'),title:document.getElementById('e_title').value,course:document.getElementById('e_course').value,date:document.getElementById('e_date').value,duration:+document.getElementById('e_dur').value,questions:+document.getElementById('e_q').value});save();closeModal();render()}
function examInfo(id){let e=data.exams.find(x=>x.id===id);modal(`<h3>${esc(e.title)}</h3><p>${esc(e.course)} · ${e.date} · ${e.duration} minutes · ${e.questions} questions</p><div class="notice">Question bank, randomization, timer, result calculation and student-wise result storage can be connected in the live exam module.</div><div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Close</button></div>`)}
function examAccess(id){let e=data.exams.find(x=>x.id===id);let eligible=data.students.filter(s=>!due(s)||!data.settings.autoBlock);modal(`<h3>Access Check — ${esc(e.title)}</h3><p>Eligible: <b>${eligible.length}</b> / ${data.students.length}</p><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Result</th></tr>${data.students.map(s=>`<tr><td>${esc(s.name)}</td><td><span class="status ${(!due(s)||!data.settings.autoBlock)?'paid':'due'}">${(!due(s)||!data.settings.autoBlock)?'EXAM OPEN':'BLOCKED — FEE DUE'}</span></td></tr>`).join('')}</table></div><div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Close</button></div>`)}
function saveSettings(){data.settings.centre=document.getElementById('set_centre').value;data.settings.autoBlock=document.getElementById('set_block').value==='true';data.settings.sms=document.getElementById('set_sms').value==='true';data.settings.whatsapp=document.getElementById('set_wa').value==='true';save();alert('Settings saved.');render()}
function resetDemo(){if(confirm('Reset demo data?')){localStorage.removeItem('djcc_data');location.reload()}}
nav();render();
</script>
</body></html>
